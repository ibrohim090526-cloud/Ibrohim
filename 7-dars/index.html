<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ismlar</title>
</head>
<body>

    <ul id="ismlarRoyxati"></ul>

    <script>
        let ismlar = [
            "Ibrohim", "Javohir", "Olimjon", "Abdulloh", "Sunatilla"
        ];

        let html = "";

        for (let ism of ismlar) {
            html += `<li>${ism}</li>`;
        }

        document.getElementById("ismlarRoyxati").innerHTML = html;
    </script>

</body>
</html>
