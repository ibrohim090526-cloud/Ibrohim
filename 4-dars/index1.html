<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Mevalar do'koni</title>
  <style>
    .card { border: 1px solid #ccc; padding: 10px; margin: 10px; }
    .sale { background-color: orange; }
    .sold-out { opacity: 0.4; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1 id="shop-title">Mevalar do'koni</h1>

  <div id="shop">
    <div class="card" id="card1">
      <h3>Olma</h3>
      <p class="price">5000</p>
      <span class="stock">Bor</span>
    </div>
    <div class="card" id="card2">
      <h3>Banan</h3>
      <p class="price">12000</p>
      <span class="stock">Bor</span>
    </div>
    <div class="card" id="card3">
      <h3>Uzum</h3>
      <p class="price">20000</p>
      <span class="stock">Tugagan</span>
    </div>
    <div class="card" id="card4">
      <h3>Anor</h3>
      <p class="price">15000</p>
      <span class="stock">Bor</span>
    </div>
  </div>

  <script>
    //3-qism
    //1.
    let shopTitle = document.getElementById("shop-title");
    shopTitle.textContent = "Yangi mavelar do'koni";
    shopTitle.style.color = "green"

    //2.
    let cards = document.querySelectorAll(".card");
    for (let i = 0; i < cards.length; i++){
        cards[i].style.borderRadius = "10px";
    }

    //3.
    let card1 = document.getElementById("card1");
    card1.classList.add("sale");

    //4.
    let card3 = document.getElementById("card3");
    card3.classList.add("sold-out")

    //5.
    let price = document.querySelectorAll(".price");
    for(let i = 0; i < price.length; i++){
        price[i].style.fontWeight = "bold"
    }

    //4-qism
    //1.
    let stocks = document.querySelectorAll(".stock");

    for(let i = 0; i < stocks.length; i++){
        if(stocks[i].textContent === "Tugagan"){
            stocks[i].parentElement.classList.add("sold-out");
        }else if (stocks[i].textContent == "Bor"){
            stocks[i].style.color = "green";
        }
    }

    //5.
    let cardlar = document.querySelectorAll(".card");

    for (let i = 0; i < cardlar.length; i++){
        let priceElement = cardlar[i].querySelector(".price");
        let priceValue = Number (priceElement.textContent);

        if (priceValue < 10000){
            cardlar[i].classList.add("sale")
        }
    }


  </script>
</body>
</html>
