<!DOCTYPE html>
<html>
    <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Koinot sirlarini o'rganish </title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        section {
            height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a2e; 
            background-image: url(https://ziyouz.uz/wp-content/uploads/2022/08/koinot.jpg); 
            background-size: cover; 
            background-position: center; 
        }

        .card {
            background-color: rgba(10, 20, 40, 0.75); 
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 650px;
           
        }

        .card h1 {
            color: gold; 
            font-size: 32px;
            margin-bottom: 20px;
        }

        .card p {
            color: white; 
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .card button {
            background-color: #38bdf8; 
            color: #000000;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
          
        }

        .card button:hover {
            opacity: 0.9;
        }

      </style>
   </head>
   <body>
       <section>
         <div class="card">
            <h1>Koinot Sirlarini O'rganamiz</h1>
            <p>
                Ushbu loyiha CSS-da HEX, RGB va nomlangan ranglar hamda background-size, 
                background-position xossalari orqali to'liq ekran hajmini egallashni ko'rsatib beradi.
            </p>
            <button>Boshlash</button>
         </div>
       </section>
   </body>
</html>
