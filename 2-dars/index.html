<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="inp" >
    <button id="btn-saqlash">Saqlash</button>
    <p id="natija"></p>


    <script>
        document.getElementById("btn-saqlash").onclick = function(){
            let ism = document.getElementById("inp").value
            localStorage.setItem("ism",ism)
            document.getElementById("natija").textContent = localStorage.getItem("ism") 
        }

    </script>
    
</body>
</html>
